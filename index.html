    <link rel="stylesheet" crossorigin href="./assets/index-BVkLnywv.css">

    <script>
      // ERRBOX: 把启动期异常直接显示到页面上（便于自动化定位空白页）
      window.__errs = [];
      function __showErr(msg) {
        try {
          window.__errs.push(String(msg));
          var el = document.getElementById('app');
          if (el) el.innerHTML = '<pre id="ERRBOX" style="color:#e06c6c;white-space:pre-wrap;padding:12px;font:12px monospace">ERRBOX|' + window.__errs.join('\n') + '</pre>';
        } catch (e) { }
      }
      window.addEventListener('error', function (e) { __showErr((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
      window.addEventListener('unhandledrejection', function (e) { __showErr('promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
    </script>
  <body>
    <div id="app"></div>
  </body>
</html>
